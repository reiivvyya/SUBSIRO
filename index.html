
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Universe</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050303;
  overflow: hidden;
  height: 100vh;
  font-family: monospace;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.title {
  position: absolute;
  top: 8%;
  width: 100%;
  text-align: center;
  color: #ff4545;
  font-size: 12px;
  letter-spacing: 5px;
  opacity: .5;
}
</style>
</head>

<body>

<div class="title">MY UNIVERSE IS YOU</div>
<canvas id="love"></canvas>

<script>
const canvas = document.getElementById("love");
const ctx = canvas.getContext("2d");

let W, H, particles = [];
let rotation = 1.35;
let progress = 0;

function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W = innerWidth;
  H = innerHeight;
}

resize();
window.addEventListener("resize", resize);

const words = [
  "I LOVE YOU",
  "love you",
  "I love you",
  "forever",
  "♥",
  "I LOVE YOU"
];

function heart(x, y) {
  return Math.pow(x*x + y*y - 1, 3)
    - x*x*y*y*y <= 0;
}

function createParticles() {
  particles = [];

  for (let i = 0; i < 850; i++) {
    let x, y;

    do {
      x = Math.random() * 2.4 - 1.2;
      y = Math.random() * 2.4 - 1.2;
    } while (!heart(x, y));

    particles.push({
      x, y,
      z: Math.random() * 2 - 1,
      size: Math.random() * 4 + 2,
      text: words[Math.floor(Math.random()*words.length)],
      delay: Math.random() * 0.5,
      speed: Math.random() * 0.8 + 0.5,
      offset: Math.random() * 100,
      color: Math.random() > .8 ? "#ff8585" : "#ff3838"
    });
  }
}

createParticles();

function draw() {
  ctx.fillStyle = "rgba(5, 3, 5, 0.22)";
  ctx.fillRect(0, 0, W, H);

  let time = performance.now() * 0.001;

  // Rotate continuously
  rotation += 0.009;

  // Slowly form the heart
  progress = Math.min(1, progress + 0.002);

  const scale = Math.min(W, H) * 0.32;

  particles.forEach(p => {

    let angle = rotation + p.z * 0.15;

    // 3D rotation
    let rx = p.x * Math.cos(angle);
    let rz = p.x * Math.sin(angle);

    let perspective = 1 / (1 + rz * 0.25);

    let x = W/2 + rx * scale * perspective;
    let y = H/2 - p.y * scale * perspective;

    // Small floating movement
    x += Math.sin(time * p.speed + p.offset) * 3;
    y += Math.cos(time * p.speed + p.offset) * 3;

    // Formation effect
    let visible = Math.min(
      1,
      Math.max(0, (progress - p.delay) * 4)
    );

    let depth = Math.cos(angle);

    ctx.save();
    ctx.globalAlpha = visible * (0.55 + Math.abs(depth)*0.45);

    ctx.font = `${p.size * perspective * 1.4}px monospace`;
    ctx.fillStyle = p.color;
    ctx.shadowColor = "#ff2525";
    ctx.shadowBlur = 10;

    ctx.fillText(p.text, x, y);

    ctx.restore();
  });

  // Floating love particles around the heart
  for(let i = 0; i < 35; i++) {
    let a = time * 0.3 + i * 2.4;
    let r = scale * (1.1 + Math.sin(time+i)*0.25);

    let x = W/2 + Math.cos(a)*r;
    let y = H/2 + Math.sin(a)*r;

    ctx.fillStyle = "rgba(255,70,70,0.65)";
    ctx.font = "10px monospace";
    ctx.fillText("♥", x, y);
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Of Love</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: Georgia, serif;
}

canvas {
    display: block;
}

#title {
    position: fixed;
    top: 7%;
    width: 100%;
    text-align: center;
    color: #ff69bd;
    font-size: clamp(18px, 4vw, 30px);
    letter-spacing: 7px;
    text-shadow: 0 0 15px #ff1493,
                 0 0 35px #ff1493;
    pointer-events: none;
}

#sub {
    position: fixed;
    top: 13%;
    width: 100%;
    text-align: center;
    color: #ff9bd2;
    font-size: 11px;
    letter-spacing: 5px;
    opacity: .7;
    pointer-events: none;
}

#message {
    position: fixed;
    bottom: 7%;
    width: 100%;
    text-align: center;
    color: #ff83c6;
    font-size: 13px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px #ff1493;
    pointer-events: none;
}

#loading {
    position: fixed;
    inset: 0;
    background: #000;
    color: #ff69bd;
    display: flex;
    justify-content: center;
    align-items: center;
    letter-spacing: 5px;
    z-index: 10;
    transition: opacity 1s;
}
</style>
</head>

<body>

<div id="loading">LOADING LOVE...</div>

<div id="title">UNIVERSE OF LOVE</div>
<div id="sub">A LITTLE UNIVERSE JUST FOR YOU</div>
<div id="message">YOU ARE MY FAVORITE UNIVERSE ♡</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ===========================
// SCENE
// ===========================

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x000000, 0.012);

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 24);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

// ===========================
// LIGHTS
// ===========================

const pinkLight = new THREE.PointLight(
    0xff1493,
    100,
    40
);

pinkLight.position.set(0, 5, 2);
scene.add(pinkLight);

const whiteLight = new THREE.PointLight(
    0xffffff,
    30,
    30
);

whiteLight.position.set(0, 8, 5);
scene.add(whiteLight);

// ===========================
// HEART PARTICLES
// ===========================

const heartGroup = new THREE.Group();
scene.add(heartGroup);

heartGroup.position.y = 3;

const heartCount = 14000;

const heartPositions = [];
const heartColors = [];
const heartSizes = [];

for (let i = 0; i < heartCount; i++) {

    const t = Math.random() * Math.PI * 2;

    const scale = 0.5 + Math.random() * 0.5;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    const depth = (Math.random() - 0.5) * 5;

    const inside = Math.random() * 0.5 + 0.5;

    heartPositions.push(
        x * 0.20 * scale * inside,
        y * 0.20 * scale * inside,
        depth * 0.5
    );

    const pink = new THREE.Color();

    pink.setHSL(
        0.91 + Math.random() * 0.06,
        0.9,
        0.5 + Math.random() * 0.3
    );

    heartColors.push(
        pink.r,
        pink.g,
        pink.b
    );

    heartSizes.push(
        Math.random() * 0.07 + 0.025
    );
}

const heartGeometry = new THREE.BufferGeometry();

heartGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        heartPositions, 3
    )
);

heartGeometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(
        heartColors, 3
    )
);

const heartMaterial = new THREE.PointsMaterial({
    size: 0.07,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const heart = new THREE.Points(
    heartGeometry,
    heartMaterial
);

heartGroup.add(heart);

// ===========================
// HEART OUTER GLOW
// ===========================

const glowGeometry = new THREE.BufferGeometry();

const glowPositions = [];

for (let i = 0; i < 3000; i++) {

    const t = Math.random() * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    glowPositions.push(
        x * 0.21 + (Math.random() - .5) * .4,
        y * 0.21 + (Math.random() - .5) * .4,
        (Math.random() - .5) * 3
    );
}

glowGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        glowPositions, 3
    )
);

const glowMaterial = new THREE.PointsMaterial({
    color: 0xff1493,
    size: 0.12,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const heartGlow = new THREE.Points(
    glowGeometry,
    glowMaterial
);

heartGroup.add(heartGlow);

// ===========================
// GALAXY VORTEX
// ===========================

const galaxy = new THREE.Group();

galaxy.position.y = -3.5;

scene.add(galaxy);

const vortexCount = 18000;

const vortexPositions = [];
const vortexColors = [];

for (let i = 0; i < vortexCount; i++) {

    const angle = Math.random() * Math.PI * 12;

    const radius = Math.random() * 8;

    const spiral = angle + radius * 1.5;

    const x = Math.cos(spiral) * radius;

    const z = Math.sin(spiral) * radius;

    const y = (Math.random() - 0.5) * 0.25;

    vortexPositions.push(x, y, z);

    const color = new THREE.Color();

    color.setHSL(
        0.88 + Math.random() * 0.1,
        1,
        0.45 + Math.random() * 0.4
    );

    vortexColors.push(
        color.r,
        color.g,
        color.b
    );
}

const vortexGeometry = new THREE.BufferGeometry();

vortexGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        vortexPositions, 3
    )
);

vortexGeometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(
        vortexColors, 3
    )
);

const vortexMaterial = new THREE.PointsMaterial({
    size: 0.055,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const vortex = new THREE.Points(
    vortexGeometry,
    vortexMaterial
);

galaxy.add(vortex);

// ===========================
// GALAXY RINGS
// ===========================

const ringColors = [
    0xff1493,
    0xff69b4,
    0xd600ff,
    0xff0080
];

const rings = [];

for (let i = 0; i < 7; i++) {

    const geometry = new THREE.TorusGeometry(
        2 + i * 0.65,
        0.018 + Math.random() * 0.025,
        8,
        200
    );

    const material = new THREE.MeshBasicMaterial({
        color: ringColors[i % ringColors.length],
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending
    });

    const ring = new THREE.Mesh(
        geometry,
        material
    );

    ring.rotation.x = Math.PI / 2;

    galaxy.add(ring);

    rings.push(ring);
}

// ===========================
// CENTER CORE
// ===========================

const coreGeometry = new THREE.SphereGeometry(
    0.48,
    32,
    32
);

const coreMaterial = new THREE.MeshBasicMaterial({
    color: 0xff1493
});

const core = new THREE.Mesh(
    coreGeometry,
    coreMaterial
);

galaxy.add(core);

// ===========================
// TEXT AROUND GALAXY
// ===========================

const words = [
    "I LOVE YOU",
    "TE AMO",
    "JE T'AIME",
    "MI AMOR ETERNO",
    "YOU ARE MY WORLD",
    "FOREVER AND ALWAYS",
    "MY FAVORITE PERSON",
    "ERES MI MAGIA",
    "SARANGHAE",
    "YOU COMPLETE ME",
    "MY ONLY LOVE",
    "HAPPY BIRTHDAY",
    "AMOR PARA SIEMPRE",
    "I CHOOSE YOU",
    "MY SWEET UNIVERSE"
];

function createText(text) {

    const canvas = document.createElement('canvas');

    canvas.width = 512;
    canvas.height = 128;

    const ctx = canvas.getContext('2d');

    ctx.font = 'bold 38px Georgia';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.shadowColor = '#ff1493';
    ctx.shadowBlur = 25;

    ctx.fillStyle = '#ff9bd2';

    ctx.fillText(text, 256, 64);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const sprite = new THREE.Sprite(material);

    sprite.scale.set(3.7, 0.9, 1);

    return sprite;
}

const textGroup = new THREE.Group();

galaxy.add(textGroup);

words.forEach((word, i) => {

    const sprite = createText(word);

    const angle = (i / words.length) * Math.PI * 2;

    const radius = 7 + Math.random() * 2;

    sprite.position.set(
        Math.cos(angle) * radius,
        0.1,
        Math.sin(angle) * radius
    );

    textGroup.add(sprite);
});

// ===========================
// FLOATING STARS
// ===========================

const starPositions = [];

for (let i = 0; i < 5000; i++) {

    starPositions.push(
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 70,
        (Math.random() - 0.5) * 100
    );
}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        starPositions, 3
    )
);

const starMaterial = new THREE.PointsMaterial({
    color: 0xffb5df,
    size: 0.045,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
});

const stars = new THREE.Points(
    starGeometry,
    starMaterial
);

scene.add(stars);

// ===========================
// SMALL FLOATING HEARTS
// ===========================

const miniHearts = [];

for (let i = 0; i < 30; i++) {

    const geometry = new THREE.IcosahedronGeometry(
        0.13, 1
    );

    const material = new THREE.MeshBasicMaterial({
        color: 0xff1493,
        wireframe: true,
        transparent: true,
        opacity: 0.65
    });

    const obj = new THREE.Mesh(
        geometry,
        material
    );

    obj.position.set(
        (Math.random() - .5) * 20,
        Math.random() * 12 - 5,
        (Math.random() - .5) * 12
    );

    obj.userData.speed =
        0.005 + Math.random() * 0.015;

    scene.add(obj);

    miniHearts.push(obj);
}

// ===========================
// MOUSE / TOUCH MOVEMENT
// ===========================

let mouseX = 0;
let mouseY = 0;

window.addEventListener('pointermove', (event) => {

    mouseX = (event.clientX / window.innerWidth - 0.5) * 2;

    mouseY = (event.clientY / window.innerHeight - 0.5) * 2;

});

// ===========================
// ANIMATION
// ===========================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    // Floating heart

    heartGroup.position.y =
        3 + Math.sin(time * 1.5) * 0.25;

    heartGroup.rotation.y =
        Math.sin(time * 0.5) * 0.15;

    heartGroup.rotation.z =
        Math.sin(time * 0.7) * 0.04;

    const pulse =
        1 + Math.sin(time * 2.5) * 0.035;

    heartGroup.scale.setScalar(pulse);

    // Galaxy rotation

    galaxy.rotation.y = time * 0.12;

    vortex.rotation.y = -time * 0.18;

    textGroup.rotation.y = -time * 0.12;

    // Rings

    rings.forEach((ring, i) => {

        ring.rotation.z =
            time * (0.04 + i * 0.008);

        ring.material.opacity =
            0.3 + Math.sin(time * 2 + i) * 0.2;

    });

    // Center core pulse

    core.scale.setScalar(
        1 + Math.sin(time * 3) * 0.18
    );

    // Stars

    stars.rotation.y = time * 0.008;

    // Mini hearts

    miniHearts.forEach((obj) => {

        obj.position.y += obj.userData.speed;

        obj.rotation.x += 0.01;
        obj.rotation.y += 0.015;

        if (obj.position.y > 9) {
            obj.position.y = -7;
        }

    });

    // Camera movement

    camera.position.x +=
        (mouseX * 1.2 - camera.position.x) * 0.015;

    camera.position.y +=
        (5 - mouseY * 0.8 - camera.position.y) * 0.015;

    camera.lookAt(0, 0, 0);

    // Glow

    pinkLight.intensity =
        80 + Math.sin(time * 3) * 25;

    renderer.render(scene, camera);
}

// ===========================
// RESPONSIVE
// ===========================

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

// START

setTimeout(() => {

    const loading = document.getElementById('loading');

    loading.style.opacity = '0';

    setTimeout(() => loading.remove(), 1000);

}, 1500);

animate();

</script>

</body>
</html>

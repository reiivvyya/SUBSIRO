
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Of Love</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  font-family: Georgia, serif;
  touch-action: manipulation;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.title {
  position: fixed;
  top: 35px;
  width: 100%;
  text-align: center;
  color: #ff5dbb;
  letter-spacing: 5px;
  font-size: 19px;
  text-shadow: 0 0 15px #ff008c,
               0 0 35px #ff008c;
  pointer-events: none;
}

.subtitle {
  position: fixed;
  top: 65px;
  width: 100%;
  text-align: center;
  color: #ff9bd5;
  font-size: 9px;
  letter-spacing: 4px;
  opacity: .7;
  pointer-events: none;
}

.bottom {
  position: fixed;
  bottom: 35px;
  width: 100%;
  text-align: center;
  color: #ff8bcf;
  font-size: 11px;
  letter-spacing: 3px;
  text-shadow: 0 0 15px #ff1493;
  pointer-events: none;
}

.hint {
  position: fixed;
  bottom: 13px;
  width: 100%;
  text-align: center;
  color: #a84a80;
  font-size: 9px;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="title">UNIVERSE OF LOVE</div>
<div class="subtitle">MADE WITH LOVE ♡</div>
<div class="bottom">YOU ARE MY UNIVERSE</div>
<div class="hint">TOUCH THE SCREEN TO SEND LOVE</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, cx, cy;
let time = 0;
let particles = [];
let stars = [];
let floatingHearts = [];
let touches = [];

function resize() {
  W = canvas.width = window.innerWidth *
      Math.min(devicePixelRatio || 1, 2);

  H = canvas.height = window.innerHeight *
      Math.min(devicePixelRatio || 1, 2);

  ctx.setTransform(
    Math.min(devicePixelRatio || 1, 2),
    0, 0,
    Math.min(devicePixelRatio || 1, 2),
    0, 0
  );

  W = window.innerWidth;
  H = window.innerHeight;

  cx = W / 2;
  cy = H * .40;
}

window.addEventListener("resize", resize);
resize();

// =================================
// HEART SHAPE
// =================================

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);

  const y = 13 * Math.cos(t)
    - 5 * Math.cos(2*t)
    - 2 * Math.cos(3*t)
    - Math.cos(4*t);

  return {x, y};
}

// =================================
// CREATE PARTICLES
// =================================

for (let i = 0; i < 6500; i++) {

  const t = Math.random() * Math.PI * 2;
  const p = heartPoint(t);

  const fill = Math.sqrt(Math.random());

  particles.push({
    x: p.x * fill,
    y: p.y * fill,
    z: (Math.random() - .5) * 8,
    size: Math.random() * 1.8 + .4,
    phase: Math.random() * 6.28,
    speed: Math.random() * .04 + .01,
    color: Math.random()
  });
}

// =================================
// STARS
// =================================

for (let i = 0; i < 500; i++) {

  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 1.5,
    alpha: Math.random(),
    speed: Math.random() * .025
  });
}

// =================================
// FLOATING HEARTS
// =================================

function addFloatingHeart(x, y) {
  floatingHearts.push({
    x, y,
    size: Math.random() * 12 + 7,
    life: 1,
    speed: Math.random() * 1.5 + .5
  });
}

// =================================
// DRAW GLOW CIRCLE
// =================================

function glow(x, y, radius, color) {

  const gradient = ctx.createRadialGradient(
    x, y, 0,
    x, y, radius
  );

  gradient.addColorStop(0, color);
  gradient.addColorStop(1, "transparent");

  ctx.fillStyle = gradient;

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

// =================================
// DRAW GALAXY
// =================================

function drawGalaxy() {

  const gx = cx;
  const gy = H * .70;

  const scale = Math.min(W / 390, 1.1);

  glow(gx, gy, 115 * scale, "rgba(255,0,130,.14)");

  // Spiral particles

  for (let i = 0; i < 4200; i++) {

    const arm = i % 4;

    const radius = Math.sqrt(i / 4200) * 125 * scale;

    const angle =
      radius * .055 +
      arm * Math.PI / 2 +
      time * .018;

    const noise = Math.sin(i * 12.3) * 5;

    const x = gx +
      Math.cos(angle) * (radius + noise);

    const y = gy +
      Math.sin(angle) * (radius + noise) * .37;

    const alpha = Math.max(
      .08,
      1 - radius / (150 * scale)
    );

    ctx.fillStyle = `rgba(255,${40 + arm * 25},${150 + arm * 20},${alpha})`;

    ctx.beginPath();

    ctx.arc(
      x, y,
      Math.random() * 1.1 + .3,
      0, Math.PI * 2
    );

    ctx.fill();
  }

  // Galaxy rings

  for (let i = 0; i < 6; i++) {

    ctx.save();

    ctx.translate(gx, gy);
    ctx.scale(1, .37);

    ctx.rotate(time * .03 + i * .08);

    ctx.strokeStyle =
      `rgba(255,${30 + i * 15},${150 + i * 10},${.25 + Math.sin(time + i) * .12})`;

    ctx.lineWidth = 1.3;

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff008c";

    ctx.beginPath();

    ctx.arc(
      0, 0,
      (35 + i * 15) * scale,
      0, Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();
  }

  // Black hole center

  glow(gx, gy, 30 * scale, "rgba(255,0,120,.5)");

  const core = ctx.createRadialGradient(
    gx, gy, 2,
    gx, gy, 19 * scale
  );

  core.addColorStop(0, "#000");
  core.addColorStop(.65, "#050008");
  core.addColorStop(.85, "#ff008c");
  core.addColorStop(1, "rgba(255,0,120,0)");

  ctx.fillStyle = core;

  ctx.beginPath();

  ctx.ellipse(
    gx, gy,
    23 * scale,
    10 * scale,
    0, 0, Math.PI * 2
  );

  ctx.fill();

  glow(gx, gy, 5 * scale, "#ffb2e0");
}

// =================================
// DRAW 3D HEART
// =================================

function drawHeart() {

  const scale = Math.min(W / 390, 1.1);

  const float = Math.sin(time * .025) * 7;

  const pulse = 1 + Math.sin(time * .04) * .035;

  const hx = cx;
  const hy = H * .34 + float;

  const projected = [];

  for (const p of particles) {

    const a = time * .006;

    const rx = p.x * Math.cos(a) -
               p.z * Math.sin(a) * .3;

    const rz = p.x * Math.sin(a) * .3 +
               p.z * Math.cos(a);

    const perspective = 1 / (1 + rz * .018);

    const x = hx + rx * 7 * scale * pulse * perspective;

    const y = hy - p.y * 7 * scale * pulse * perspective;

    projected.push({
      x, y,
      z: rz,
      size: p.size * perspective,
      phase: p.phase,
      color: p.color
    });
  }

  projected.sort((a, b) => a.z - b.z);

  for (const p of projected) {

    const flicker =
      .5 + Math.sin(time * .07 + p.phase) * .35;

    const pink = Math.floor(130 + flicker * 100);

    ctx.fillStyle =
      `rgba(255,${pink - 40},${pink},${.45 + flicker * .5})`;

    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ff008c";

    ctx.beginPath();

    ctx.arc(
      p.x, p.y,
      p.size * scale,
      0, Math.PI * 2
    );

    ctx.fill();
  }

  ctx.shadowBlur = 0;

  // Bright heart center glow

  glow(hx, hy, 25 * scale, "rgba(255,0,130,.12)");

  // Heart sparkle

  for (let i = 0; i < 8; i++) {

    const angle = time * .02 + i * .785;

    const x = hx + Math.cos(angle) * 15 * scale;
    const y = hy + Math.sin(angle) * 15 * scale;

    glow(x, y, 5, "rgba(255,130,220,.5)");
  }
}

// =================================
// ORBITING TEXT
// =================================

const messages = [
  "I LOVE YOU ♡",
  "TE AMO",
  "MI AMOR",
  "FOREVER",
  "SARANGHAE",
  "YOU ARE MY WORLD",
  "JE T'AIME",
  "MY LOVE",
  "ERES MI MAGIA",
  "HAPPY BIRTHDAY",
  "AMOR ETERNO",
  "ALWAYS YOU",
  "MY UNIVERSE",
  "ONLY YOU",
  "LOVE FOREVER"
];

function drawTextOrbit() {

  const radius = Math.min(W * .43, 170);

  const gy = H * .70;

  messages.forEach((word, i) => {

    const angle =
      i / messages.length * Math.PI * 2 +
      time * .0015;

    const x = cx + Math.cos(angle) * radius;
    const y = gy + Math.sin(angle) * radius * .35;

    const depth = Math.sin(angle);

    ctx.save();

    ctx.globalAlpha = .45 + (depth + 1) * .25;

    ctx.font = "bold 10px monospace";

    ctx.textAlign = "center";

    ctx.fillStyle = "#ff91ca";

    ctx.shadowBlur = 12;
    ctx.shadowColor = "#ff1493";

    ctx.fillText(word, x, y);

    ctx.restore();
  });
}

// =================================
// DRAW STARS
// =================================

function drawStars() {

  stars.forEach(s => {

    s.alpha += s.speed * .03;

    const opacity =
      .25 + Math.abs(Math.sin(time * .02 + s.alpha)) * .7;

    ctx.fillStyle =
      `rgba(255,180,220,${opacity})`;

    ctx.beginPath();

    ctx.arc(
      s.x, s.y,
      s.size,
      0, Math.PI * 2
    );

    ctx.fill();
  });
}

// =================================
// FLOATING HEART ANIMATION
// =================================

function drawFloatingHearts() {

  floatingHearts.forEach((h, i) => {

    h.y -= h.speed;
    h.life -= .009;

    ctx.save();

    ctx.globalAlpha = Math.max(0, h.life);

    ctx.font = `${h.size}px serif`;

    ctx.fillStyle = "#ff4eae";

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff008c";

    ctx.fillText("♥", h.x, h.y);

    ctx.restore();

    if (h.life <= 0) {
      floatingHearts.splice(i, 1);
    }
  });
}

// =================================
// ANIMATION LOOP
// =================================

function animate() {

  requestAnimationFrame(animate);

  time++;

  ctx.fillStyle = "#000";

  ctx.fillRect(0, 0, W, H);

  drawStars();

  // Background glow

  glow(
    cx,
    H * .42,
    180,
    "rgba(100,0,60,.10)"
  );

  drawGalaxy();

  drawTextOrbit();

  drawHeart();

  drawFloatingHearts();

  // Mouse / touch particles

  touches.forEach((t, i) => {

    t.life -= .025;

    if (t.life <= 0) {
      touches.splice(i, 1);
      return;
    }

    glow(
      t.x, t.y,
      30 * t.life,
      `rgba(255,0,140,${t.life * .3})`
    );
  });
}

// =================================
// TOUCH INTERACTION
// =================================

canvas.addEventListener("pointerdown", e => {

  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  touches.push({
    x, y,
    life: 1
  });

  for (let i = 0; i < 5; i++) {
    addFloatingHeart(
      x + (Math.random() - .5) * 40,
      y + (Math.random() - .5) * 40
    );
  }

});

animate();

</script>
</body>
</html>
